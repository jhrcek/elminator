name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      - uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser python3-pip
          sudo ln -s "$(which chromium-browser)" /usr/bin/chromium

      - name: Install Elm compiler
        run: |
          wget https://github.com/elm/compiler/releases/download/0.19.1/binary-for-linux-64-bit.gz
          gunzip binary-for-linux-64-bit.gz
          chmod +x binary-for-linux-64-bit
          sudo mv binary-for-linux-64-bit /usr/bin/elm

      - name: Install Python dependencies
        run: pip3 install rcrepl websocket-client

      - name: Clone elminator-test
        run: git clone https://bitbucket.org/sras/elminator-test ${{ runner.temp }}/elminator-test

      - name: Build elminator-test
        run: cd ${{ runner.temp }}/elminator-test && stack build

      - name: Setup GHCi
        run: |
          echo ":set prompt RCGHCIPROMPT>>>" > ~/.ghci
          chmod go-w ~/.ghci

      - name: Start rcghci
        run: |
          export RCGHCI_PROMPT='RCGHCIPROMPT>>>'
          export RCREPL_PORT=1880
          rcghci - --ghci-options "+RTS -M2G -RTS" &

      - name: Run tests
        run: cd ${{ runner.temp }}/elminator-test && python3 test.py
